services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ara_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ara}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ara} -d ${POSTGRES_DB:-ara}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ara_pgdata:
